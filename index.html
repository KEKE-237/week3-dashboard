<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>🌍 Weather Dashboard</h1>
    <p class="subtitle">Live weather across 8 global cities</p>
  </header>

  <main>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search city…" autocomplete="off" />
      <button id="retry">↺ Refresh</button>
    </div>

    <div id="stats" class="stats"></div>

    <p id="loading" hidden>Loading weather data…</p>
    <p id="error"   hidden class="error"></p>

    <div id="grid" class="grid"></div>
  </main>

  <footer>Data from <a href="https://open-meteo.com" target="_blank">Open-Meteo</a></footer>

  <script type="module" src="ui.js"></script>
</body>
</html>
